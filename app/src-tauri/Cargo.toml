[package]
name = "ytdownload"
version = "0.1.0"
description = "YTDownload: baixa vídeos e músicas do YouTube"
authors = ["Adrian Rabelo"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "ytdownload_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
tauri-plugin-ytdlp = { path = "../plugins/ytdlp" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
